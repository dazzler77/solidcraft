name: Build SolidCraft WASM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SolidCraft version/tag to build"
        required: true
        default: "v0.40.0-rc.3"
        type: string

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected SolidCraft version
        uses: actions/checkout@v4
        with:
          repository: tangency-labs/solidcraft
          ref: ${{ inputs.version }}

      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          trunk --version

      - name: Build SolidCraft Web
        working-directory: apps/solidcraft-web
        run: |
          trunk build --release --public-url ./

      - name: Find generated WASM web build
        run: |
          echo "Looking for generated WASM files..."
          find . -type f \( -name "*.wasm" -o -name "index.html" \) -print
          echo ""
          echo "Possible build directories:"
          find . -type d \( -name "dist" -o -name "web" -o -name "public" \) -print

